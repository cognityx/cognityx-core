[project]
name = "cognityx-core"
version = "0.1.0"
description = "Shared, dependency-light interfaces for Cognityx AI systems"
readme = "README.md"
authors = [
    { name = "Bhujay Kumar Bhatta", email = "bhujay.bhatta@yahoo.com" }
]
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "mkdocs-material>=9.5",
    "mkdocstrings-python>=1.12",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
