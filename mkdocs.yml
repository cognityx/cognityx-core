site_name: Cognityx Core
site_description: Shared interfaces for Cognityx AI systems
dev_addr: 127.0.0.1:8124
theme:
  name: material
nav:
  - Home: index.md
  - Training and reports: training.md
  - Architecture: architecture.md
  - Interfaces: interfaces.md
  - API reference: api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_root_heading: true
            members_order: source
markdown_extensions:
  - admonition
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
strict: true
